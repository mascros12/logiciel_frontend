<main class="carnet-public">
  @if (loading()) {
    <p>Chargement…</p>
  } @else if (missing() || !document()) {
    <section class="carnet-public__missing">
      <h1>Carnet de route</h1>
      <p>Ce carnet n'est pas disponible.</p>
    </section>
  } @else {
    <div class="carnet-public__bar">
      <button type="button" (click)="download('illustrated')" [disabled]="downloading() !== null">
        {{ downloading() === 'illustrated' ? 'Préparation…' : 'Télécharger le PDF illustré' }}
      </button>
      <button
        type="button"
        class="is-secondary"
        (click)="download('simple')"
        [disabled]="downloading() !== null"
      >
        {{ downloading() === 'simple' ? 'Préparation…' : 'Télécharger le PDF simplifié' }}
      </button>
      @if (pdfError()) {
        <p>Le PDF n'est pas disponible.</p>
      }
    </div>
    <app-carnet-preview
      [document]="document()!"
      [mode]="'published'"
      [publicMediaBase]="mediaBase()"
    />
  }
</main>
