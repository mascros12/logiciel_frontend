server {
  listen 80;
  server_name _;

  # Sin esto nginx responde 413 a partir de 1 MB. La aplicación admite 8 MB.
  client_max_body_size 10m;
  # El PDF ilustrado se arma entero antes del primer byte. El corte por
  # defecto (60 s) lo muestra nginx como 502.
  proxy_connect_timeout 15s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;
  # Docker cambia la IP de «backend» al recrear el contenedor. Sin esto nginx
  # se queda con la IP del arranque y cada /api responde 502.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_host backend;

  root /usr/share/nginx/html;
  index index.html;

  # Documentación API bajo /api/* (no choca con rutas Angular).
  location = /api/openapi.json {
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/static/swagger-ui/ {
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/docs {
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/docs/ {
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/redoc {
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy API al backend en la red interna de docker-compose.
  location /api/v1/ {
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Health endpoint del backend (opcional, útil para monitoreo).
  location /health {
    proxy_pass http://$api_host:8000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
